name: Validation

# Correctness suites for the parts Gradle does not cover: the Cloudflare Worker
# (Node) and the data pipeline (Python). No Android build and no artifacts.
# Report-queue liveness runs in its own weekly workflow, so this one stays green
# on a healthy tree even while a drain is due.

on:
  push:
    branches:
      - master
    # The report Worker commits a file here for every community report.
    paths-ignore:
      - "data/reports/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-suites:
    name: Worker and pipeline suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run Worker and pipeline suites
        run: pwsh -NoProfile -File scripts/run-pipeline-tests.ps1 -CorrectnessOnly
