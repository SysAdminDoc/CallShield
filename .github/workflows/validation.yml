name: Validation

# Correctness suites for the parts Gradle does not cover: the Cloudflare Worker
# (Node) and the data pipeline (Python). No Android build and no artifacts.
# Report-queue liveness runs in its own weekly workflow, so this one stays green
# on a healthy tree even while a drain is due.

on:
  push:
    branches:
      - master
    # The report Worker commits a file here for every community report.
    paths-ignore:
      - "data/reports/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-suites:
    name: Worker and pipeline suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run Worker and pipeline suites
        run: pwsh -NoProfile -File scripts/run-pipeline-tests.ps1 -CorrectnessOnly
