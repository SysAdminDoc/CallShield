name: Pipeline liveness

# Weekly check that community reports are being consumed and that upstream
# sources with a timetable are still being imported. A failure opens one issue
# labelled pipeline-stalled, later failures comment on it, and the first passing
# run closes it. A source within a week of going stale (exit code 3) opens or
# updates the same issue as a warning without failing the job. The queue is
# expected to go stale between drains, so this lives apart from the push
# workflow instead of turning it permanently red.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  liveness:
    name: Report queue and source freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run the liveness checks
        id: check
        run: |
          set +e
          python scripts/pipeline_liveness.py --scheduled > liveness.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat liveness.txt

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly pipeline check failed on %s.\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%d)" "$(cat liveness.txt)")"
          number="$(gh issue list --state open --label pipeline-stalled --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create pipeline-stalled --color B60205 --description "The weekly pipeline check is failing" 2>/dev/null || true
            gh issue create --title "Report pipeline is stalled" --label pipeline-stalled --body "$body"
          fi
          exit 1

      - name: Warn about a source close to stale
        if: steps.check.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly pipeline check passed on %s, with a warning: a source goes stale within a week.\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%d)" "$(cat liveness.txt)")"
          number="$(gh issue list --state open --label pipeline-stalled --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create pipeline-stalled --color B60205 --description "The weekly pipeline check is failing" 2>/dev/null || true
            gh issue create --title "Report pipeline warning: a source goes stale within a week" --label pipeline-stalled --body "$body"
          fi

      - name: Close the tracking issue once healthy
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --state open --label pipeline-stalled --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The weekly pipeline check passed on $(date -u +%Y-%m-%d)."
          done
