AutoName: CallShield
Summary: Spam call and text blocker with on-device detection
Description: |-
  CallShield blocks spam calls and text messages with layered on-device
  detection, scheduled public spam-data updates, and a privacy-first Android
  experience.

  Core protection runs locally on your phone. CallShield combines personal
  allow/block rules, contacts, public spam databases, prefix and wildcard
  rules, quiet hours, callback detection, STIR/SHAKEN signals, heuristics,
  campaign burst detection, SMS keyword analysis, and a pure Kotlin
  machine-learning scorer.

  Network access is limited to public spam-data sync, optional caller lookup,
  optional URL safety checks, and optional anonymous community reports. No
  Google Play Services, Firebase, Crashlytics, advertising SDK, or analytics
  SDK is required.

