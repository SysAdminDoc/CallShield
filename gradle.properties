# CVE-2026-53914 (Kotlin < 2.4.20, CWE-502): unsafe deserialization of
# untrusted Gradle build-cache metadata can execute code during a build. The
# exposure requires a SHARED / REMOTE build cache feeding attacker-controllable
# entries. CallShield configures no remote build cache (there is no
# `buildCache { remote { ... } }` in settings.gradle.kts), so the vector is not
# reachable; the local cache is produced by this machine and is trusted. Do NOT
# add a remote/shared build cache until Kotlin is on >= 2.4.20 — that bump rides
# the AGP 9 tranche tracked in Roadmap_Blocked.md.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
