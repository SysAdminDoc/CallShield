name = "callshield-reports"
main = "community-reports-worker.js"
compatibility_date = "2024-01-01"

[vars]
# GITHUB_TOKEN is set via `wrangler secret put GITHUB_TOKEN`
# Do NOT put the actual token here — use wrangler secrets

# Rate-limit KV namespace. Create with:
#   wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
