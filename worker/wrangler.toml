name = "callshield-reports"
main = "community-reports-worker.js"
compatibility_date = "2024-01-01"

[vars]
# GITHUB_TOKEN is set via `wrangler secret put GITHUB_TOKEN`
# REPORTER_BUCKET_SECRET is set via `wrangler secret put REPORTER_BUCKET_SECRET`
# Do NOT put the actual token here — use wrangler secrets
# ALLOW_UNLIMITED_REPORTS is intentionally absent. It is a local-test escape
# hatch only; setting it in a deployed environment disables the KV guard.

# Rate-limit KV namespace (per-client+number+type dedup markers, and the
# fallback burst counter when the limiter binding below is unavailable). A
# client is an IPv4 address or an IPv6 /64. There is no id on purpose:
# wrangler 4.45+ creates the namespace on the first deploy and keeps it linked
# on later ones.
[[kv_namespaces]]
binding = "RATE_LIMIT"

# Accepted reports wait here and go to GitHub as one commit a day, instead of
# one commit per report (see ReportQueue in the worker).
[[durable_objects.bindings]]
name = "REPORT_QUEUE"
class_name = "ReportQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportQueue"]

# Atomic per-client burst control, keyed like the dedup markers above (an IPv4
# address or an IPv6 /64). The Workers rate-limiting binding evaluates its
# counter atomically per key, so a burst of concurrent requests cannot slip
# past the cap the way it can between the KV counter's read and write. The
# namespace_id is an arbitrary account-unique integer (no dashboard
# provisioning needed); `period` only supports 10 or 60 seconds.
[[unsafe.bindings]]
name = "REPORT_LIMITER"
type = "ratelimit"
namespace_id = "5001"
simple = { limit = 5, period = 60 }
