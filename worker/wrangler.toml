name = "callshield-reports"
main = "community-reports-worker.js"
compatibility_date = "2026-09-26"

[vars]
# GITHUB_TOKEN is set via `wrangler secret put GITHUB_TOKEN`
# REPORTER_BUCKET_SECRET is set via `wrangler secret put REPORTER_BUCKET_SECRET`
# Do NOT put the actual token here — use wrangler secrets
# ALLOW_UNLIMITED_REPORTS is intentionally absent. It is a local-test escape
# hatch only; setting it in a deployed environment disables the KV guard.
# Reports of these numbers are dropped, and the client that sent one is banned
# until UTC midnight. Read every five minutes; unset means no holds.
HELD_NUMBERS_URL = "https://raw.githubusercontent.com/SysAdminDoc/CallShield/master/data/spam_numbers_held.json"

# Rate-limit KV namespace (the fallback burst counter when the limiter binding
# below is unavailable, and the markers when REPORT_MARKERS is unbound). A
# client is an IPv4 address or an IPv6 /64. Wrangler provisions the namespace
# at deploy time when this binding has no id. Keep the generated id locally;
# a fresh namespace starts without the previous seven-day report-id markers.
[[kv_namespaces]]
binding = "RATE_LIMIT"

# Atomic per-client burst control, keyed like the dedup markers above (an IPv4
# address or an IPv6 /64). The Workers rate-limiting binding evaluates its
# counter atomically per key, so a burst of concurrent requests cannot slip
# past the cap the way it can between the KV counter's read and write. The
# namespace_id is an arbitrary account-unique integer (no dashboard
# provisioning needed); `period` only supports 10 or 60 seconds.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "5001"

[ratelimits.simple]
limit = 5
period = 60

# A carrier gives each phone a /64 out of a shared /48, so the /48 (an IPv4
# /24) gets a larger budget of its own. The code falls back to KV counters
# when the limiter bindings are missing.
[[ratelimits]]
name = "REPORT_GROUP_LIMITER"
namespace_id = "5002"

[ratelimits.simple]
limit = 20
period = 60

# The whole Worker gets one budget per minute so a flood spread across
# networks can't become a flood of GitHub commits. A rate-limiting binding
# counts separately in each Cloudflare location, so this budget is one
# Durable Object (the instance named "all") that every location asks. It
# keeps its count in memory and stores nothing; SQLite-backed so it runs on
# the Workers Free plan.
[[durable_objects.bindings]]
name = "REPORT_GLOBAL_COUNTER"
class_name = "ReportGlobalCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportGlobalCounter"]

# The duplicate, report-id and ban markers, and the daily counts GET /stats
# reads (with STATS_TOKEN, set via `wrangler secret put STATS_TOKEN`), in one
# SQLite object. KV on the free plan takes 1,000 writes a day, which the
# markers were heading past; this takes 100,000 row writes. To back out,
# remove this binding (keep the class and the migration) and the markers go
# back to KV.
[[durable_objects.bindings]]
name = "REPORT_MARKERS"
class_name = "ReportMarkers"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReportMarkers"]
